<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Punta Fina 2026 - Selección de Territorio</title>
    <link rel="stylesheet" href="selector/selector.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="selector-container">
        <!-- Top Text -->
        <div class="top-info">

        </div>

        <!-- Main Content Area (Layout matching the mockup) -->
        <div class="selection-grid">
            <div class="selection-item">
                <a href="amazon-mx.html" class="selector-link">
                    <img src="selector/btn-mx.png" alt="México" class="selector-btn">
                </a>
            </div>
            <div class="selection-item">
                <a href="amazon-col.html" class="selector-link">
                    <img src="selector/btn-col.png" alt="Colombia" class="selector-btn">
                </a>
            </div>
        </div>
    </div>

</html>
