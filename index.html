<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puntafina</title>
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>

<body>
    <main>
        <!-- Hero Section (Video 1 + Elevator Frame + Inner Image) -->
        <section class="hero-section">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="Videos/video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- S1: Header texts -->
            <div id="datetime-display" class="datetime-display"></div>
            <div class="cities-display">cdmx · miami · bogotá · buenos aires · madrid</div>

            <!-- S2: Amantes de las -->
            <div class="amantes-text">Amantes de las</div>

            <!-- S4: Textos descriptivos -->
            <div class="overlay-texts">
                <p class="text-sonamos">Acá abajo podrás conocer las historias que tenemos para ti, en nuestra zona de
                    elevator pitches. Llama a cualquiera de los elevadores haciendo click en el botón y déjate
                    sorprender</p>
            </div>

            <div class="elevator-overlay">
                <img src="Videos/imagen1.png" alt="Elevator Frame" class="elevator-frame">
                <img src="Videos/imagen1.1.png" alt="Elevator Screen" class="elevator-screen">
                <div id="floor-display" class="floor-display">Piso 1</div>
            </div>

        </section>

        <!-- Second Video -->
        <section class="video-section">
            <!-- Preloaded Videos for Seamless Switching -->
            <video id="video-1" class="floor-video active" autoplay loop playsinline preload="auto">
                <source src="videos-pisos/piso1.mp4" type="video/mp4">
            </video>
            <video id="video-2" class="floor-video" muted loop playsinline preload="none">
                <source src="videos-pisos/piso2.mp4" type="video/mp4">
            </video>
            <!-- Floor 3 file missing, placeholder or skipped -->
            <video id="video-3" class="floor-video" muted loop playsinline preload="none">
                <!-- source src="videos-pisos/piso3.mp4" -->
            </video>
            <video id="video-4" class="floor-video" muted loop playsinline preload="none">
                <source src="videos-pisos/piso4.mp4" type="video/mp4">
            </video>
            <video id="video-5" class="floor-video" muted loop playsinline preload="none">
                <source src="videos-pisos/piso5.mp4" type="video/mp4">
            </video>
            <video id="video-6" class="floor-video" muted loop playsinline preload="none">
                <source src="videos-pisos/piso6.mp4" type="video/mp4">
            </video>

            <!-- Video Progress Bar -->
            <div class="video-progress-container">
                <div id="video-progress-bar" class="video-progress-bar"></div>
            </div>

            <!-- Video Controls -->
            <div class="video-controls">
                <button id="play-btn" class="control-btn" title="Reproducir">
                    <svg viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
                <button id="pause-btn" class="control-btn" title="Pausar">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                    </svg>
                </button>
                <button id="stop-btn" class="control-btn" title="Detener">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 6h12v12H6z" />
                    </svg>
                </button>
            </div>

            <!-- Control Panel -->
            <div class="control-panel">
                <img src="Videos/botonera fondo.webp" alt="Control Panel Background" class="panel-bg">
                <div class="panel-buttons">
                    <button class="elevator-btn" data-floor="6" data-title="Piso 6">6</button>
                    <button class="elevator-btn" data-floor="5" data-title="Piso 5">5</button>
                    <button class="elevator-btn" data-floor="4" data-title="Piso 4">4</button>
                    <button class="elevator-btn" data-floor="3" data-title="Piso 3">3</button>
                    <button class="elevator-btn" data-floor="2" data-title="Piso 2">2</button>
                    <button class="elevator-btn active" data-floor="1" data-title="Piso 1">1</button>
                </div>
            </div>
        </section>

        <!-- Use a dedicated section for the base image to avoid overlap -->
        <section class="base-section">
            <div class="base-content-wrapper">
                <a href="catalogo.html">
                    <img src="ascensor/nuevo-haz-click.png" alt="Haz click aquí" class="base-text-overlay">
                </a>
            </div>
            <div class="footer-logos-container">
                <img src="ascensor/logos-pf-storyvisual-base.png" alt="Logos Footer" class="footer-logos">
            </div>
        </section>
    </main>
    <script src="script.js?v=1.1"></script>
</body>

</html>
