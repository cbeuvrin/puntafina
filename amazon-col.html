<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Col</title>
    <link rel="stylesheet" href="styles.css?v=1.1">
</head>

<body>
    <main>
        <!-- Hero Section (Video 1 + Elevator Frame + Inner Image) -->
        <section class="hero-section">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="Videos/video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- S1: Header texts -->
            <div id="datetime-display" class="datetime-display"></div>
            <div class="cities-display">cdmx · miami · bogotá · buenos aires · madrid</div>

            <!-- S2: Amantes de las -->
            <div class="amantes-text">Amantes de las</div>

            <!-- S4: Textos descriptivos -->
            <div class="overlay-texts">
                <p class="text-sonamos">Acá abajo podrás conocer las historias que tenemos para ti, en nuestra zona de elevator pitches. Llama a cualquiera de los elevadores haciendo click en el botón y déjate sorprender</p>
            </div>

            <div class="elevator-overlay">
                <img src="Videos/imagen1.png" alt="Elevator Frame" class="elevator-frame">
                <img src="Videos/imagen1.1.png" alt="Elevator Screen" class="elevator-screen">
                <div id="floor-display" class="floor-display">Piso 1</div>
            </div>

        </section>

        <!-- Second Video -->
        <section class="video-section">
            <!-- Preloaded Videos for Amazon Col -->
            <video id="video-1" class="floor-video active" autoplay loop playsinline preload="metadata">
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/VIDEO-PITCH-Roxana-RAUL.mp4" type="video/mp4">
            </video>
            <video id="video-2" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/VIDEO-PITCH-La-Aeromoza-del-Presidente-RAUL.mp4" type="video/mp4">
            </video>
            <video id="video-3" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/7-VIDEO-PITCH-TU-MEJOR-ERROR-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-4" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/3-VIDEO-PITCH-DIARIO-DE-UN-CANALLA-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-5" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/8-VIDEO-PITCH-VOLVERTE-A-VER-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-6" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/6-VIDEO-PITCH-SENUELO-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-7" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/11-VIDEO-PITCH-GUERRA-VERDE-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-8" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/12-VIDEO-PITCH-SIN-MATERIAL-PARA-PROTAGONISTA-Ascensor.mp4" type="video/mp4">
            </video>
            <video id="video-9" class="floor-video" loop playsinline>
                <source src="https://storyvisual.puntafinastudios.com/wp-content/uploads/2026/03/13-VIDEO-PITCH-LO-QUE-VIENE-DESPUES-DEL-AMOR-Ascensor.mp4" type="video/mp4">
            </video>

            <!-- Control Panel -->
            <div class="control-panel nine-floors">
                <img src="Videos/botonera fondo.webp" alt="Control Panel Background" class="panel-bg">
                <div class="panel-buttons">
                    <button class="elevator-btn" data-floor="9">9</button>
                    <button class="elevator-btn" data-floor="8">8</button>
                    <button class="elevator-btn" data-floor="7">7</button>
                    <button class="elevator-btn" data-floor="6">6</button>
                    <button class="elevator-btn" data-floor="5">5</button>
                    <button class="elevator-btn" data-floor="4">4</button>
                    <button class="elevator-btn" data-floor="3">3</button>
                    <button class="elevator-btn" data-floor="2">2</button>
                    <button class="elevator-btn active" data-floor="1">1</button>
                </div>
            </div>
        </section>

        <!-- Use a dedicated section for the base image to avoid overlap -->
        <section class="base-section">
            <img src="ascensor/glass-inferior-base.png" alt="Elevator Base" class="elevator-base-img">

            <div class="base-content-wrapper">
                <a href="https://storyvisual.puntafinastudios.com/amazon_col/" target="_blank" rel="noopener noreferrer">
                    <img src="ascensor/texto-haz-click.png" alt="Haz click aquí" class="base-text-overlay">
                </a>
                <!-- Final Video Section -->
                <div class="video-container">
                    <video controls width="100%" height="100%" preload="metadata">
                        <source src="VIDEO%20PARTE%20FINAL%20DEL%20ASCENSOR/PFS_VideoNoteOfIntention_RPyRC_ONLINE%20110326%20H264.mp4#t=0.001" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
            <div class="footer-logos-container">
                <img src="ascensor/logos-pf-storyvisual-base.png" alt="Logos Footer" class="footer-logos">
            </div>
        </section>
    </main>
    <script src="script.js?v=1.1"></script>
</body>

</html>
