<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon MX V2</title>
    <link rel="stylesheet" href="styles.css?v=1.1">
    <script src="https://player.vimeo.com/api/player.js"></script>
</head>

<body class="amazon-mx-page">
    <main>
        <!-- Hero Section (Video 1 + Elevator Frame + Inner Image) -->
        <section class="hero-section">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="Videos/video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- S1: Header texts -->
            <div id="datetime-display" class="datetime-display"></div>
            <div class="cities-display">cdmx · miami · bogotá · buenos aires · madrid</div>

            <!-- S2: Amantes de las -->
            <div class="amantes-text">Amantes de las</div>

            <!-- S4: Textos descriptivos -->
            <div class="overlay-texts">
                <p class="text-sonamos">Acá abajo podrás conocer las historias que tenemos para ti, en nuestra zona de elevator pitches. Llama a cualquiera de los elevadores haciendo click en el botón y déjate sorprender</p>
            </div>

            <div class="elevator-overlay">
                <img src="Videos/imagen1.png" alt="Elevator Frame" class="elevator-frame">
                <img src="Videos/imagen1.1.png" alt="Elevator Screen" class="elevator-screen">
                <div id="floor-display" class="floor-display">Piso 1</div>
            </div>

        </section>

        <!-- Second Video -->
        <section class="video-section">
            <!-- Preloaded Vimeo Iframes for Amazon MX V2 -->
            <div id="video-1" class="floor-video active">
                <iframe src="https://player.vimeo.com/video/1179695986?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-2" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1178933617?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-3" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179697855?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-4" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179697526?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-5" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691593?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-6" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691724?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-7" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691920?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-8" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691697?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-9" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691899?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div id="video-10" class="floor-video">
                <iframe data-src="https://player.vimeo.com/video/1179691899?api=1&background=0&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
            </div>

            <!-- Video Progress Bar -->
            <div class="video-progress-container">
                <div id="video-progress-bar" class="video-progress-bar"></div>
            </div>

            <!-- Video Controls -->
            <div class="video-controls">
                <button id="play-btn" class="control-btn" title="Reproducir">
                    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="pause-btn" class="control-btn" title="Pausar">
                    <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <button id="stop-btn" class="control-btn" title="Detener">
                    <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                </button>
            </div>

            <!-- Control Panel -->
            <div class="control-panel ten-floors">
                <img src="Videos/botonera fondo.webp" alt="Control Panel Background" class="panel-bg">
                <div class="panel-buttons">
                    <button class="elevator-btn" data-floor="10" data-title="Lo que viene después del Amor">10</button>
                    <button class="elevator-btn" data-floor="9" data-title="Sin Material para Protagonista">9</button>
                    <button class="elevator-btn" data-floor="8" data-title="Cenizas de Plata">8</button>
                    <button class="elevator-btn" data-floor="7" data-title="Volverte a Ver">7</button>
                    <button class="elevator-btn" data-floor="6" data-title="Diario de un Canalla">6</button>
                    <button class="elevator-btn" data-floor="5" data-title="Tu Mejor Error">5</button>
                    <button class="elevator-btn" data-floor="4" data-title="Fiesta Finn">4</button>
                    <button class="elevator-btn" data-floor="3" data-title="Tepito Witón">3</button>
                    <button class="elevator-btn" data-floor="2" data-title="Doble Cara">2</button>
                    <button class="elevator-btn active" data-floor="1" data-title="Coyote VIP">1</button>
                </div>
            </div>
        </section>

        <!-- Use a dedicated section for the base image to avoid overlap -->
        <section class="base-section">
            <div class="base-content-wrapper">
                <a href="https://storyvisual.puntafinastudios.com/amazon_mx-2/">
                    <img src="ascensor/nuevo-haz-click.png" alt="Haz click aquí" class="base-text-overlay">
                </a>
            </div>
            <div class="footer-logos-container">
                <img src="ascensor/logos-pf-storyvisual-base.png" alt="Logos Footer" class="footer-logos">
            </div>
        </section>
    </main>
    <script src="script.js?v=1.1"></script>
</body>

</html>
